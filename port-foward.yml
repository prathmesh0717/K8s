apiVersion: apps/v1
kind: Deployment
metadata:
 name: deploy-nginx
 namespace: uat
spec:
 replicas: 4
 selector:
   matchLabels:
     app: nginx-app
 template:
   metadata:
     labels:
       app: nginx-app
   spec:
    containers:
     - name: cont1
       image: prathmesh72/portforward:v1
       ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
 name: np-svc
spec:
 type: NodePort
 selector:
   app: nginx-app
 ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    nodePort: 32232
